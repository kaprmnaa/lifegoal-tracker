<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0C10" />
    <title>lifegoal.direction — Pilih Aplikasi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0A0C10;
        --card: #12151B;
        --border: #21262F;
        --text: #EDEFF2;
        --text-dim: #8B95A5;
        --ember: #FF5A36;
        --cyan: #2CC9FF;
        --violet: #8B5CF6;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .wrap {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-family: 'Sora', sans-serif;
        font-size: 22px;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      p.sub {
        color: var(--text-dim);
        font-size: 14px;
        margin: 0 0 32px;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      a.card {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        text-align: left;
        transition: border-color .15s, transform .15s;
      }
      a.card:hover { transform: translateY(-2px); }
      a.card.habit:hover { border-color: var(--ember); }
      a.card.finance:hover { border-color: var(--cyan); }
      a.card.tugas:hover { border-color: var(--violet); }
      .icon {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
        flex-shrink: 0;
      }
      .habit .icon { background: rgba(255,90,54,0.14); }
      .finance .icon { background: rgba(44,201,255,0.14); }
      .tugas .icon { background: rgba(139,92,246,0.14); }
      .card-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; }
      .card-desc { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>lifegoal.direction</h1>
      <p class="sub">Pilih aplikasi yang mau kamu buka.</p>
      <div class="cards">
        <a class="card habit" href="/habit">
          <div class="icon">🔥</div>
          <div>
            <div class="card-title">Pulse — Habit Tracker</div>
            <div class="card-desc">Lacak kebiasaan & disiplin harian</div>
          </div>
        </a>
        <a class="card finance" href="/finance">
          <div class="icon">🔗</div>
          <div>
            <div class="card-title">FinanceTrack</div>
            <div class="card-desc">Lacak pengeluaran seperti ledger on-chain</div>
          </div>
        </a>
        <a class="card tugas" href="/tugas">
          <div class="icon">📋</div>
          <div>
            <div class="card-title">Papan Tugas SMA</div>
            <div class="card-desc">Reminder tugas sekolah per mata pelajaran</div>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
